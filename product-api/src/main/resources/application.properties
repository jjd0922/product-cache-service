management.endpoints.web.exposure.include=health,info,metrics
management.metrics.tags.application=product-cache-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/product_db?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

product.cache.rebuild-job-store=redis
product.cache.rebuild-job-key-prefix=product:cache:rebuild:job:
product.cache.rebuild-active-key=product:cache:rebuild:active
product.cache.rebuild-job-ttl-seconds=86400
product.cache.rebuild-active-ttl-seconds=21600

product.cache.enabled=${PRODUCT_CACHE_ENABLED:true}
product.cache.detail-ttl-seconds=1800
product.cache.detail-ttl-jitter-seconds=120
product.cache.runtime-ttl-seconds=300
product.cache.runtime-ttl-jitter-seconds=30

product.admin.username=${PRODUCT_ADMIN_USERNAME:admin}
product.admin.password=${PRODUCT_ADMIN_PASSWORD:admin}
