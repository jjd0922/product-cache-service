spring.application.name=product-cache-service

management.endpoints.web.exposure.include=health,info,metrics
management.metrics.tags.application=product-cache-service
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.baggage.remote-fields=requestId
management.tracing.baggage.correlation.fields=requestId

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/product_db?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

product.cache.rebuild-job-store=redis
product.cache.rebuild-job-key-prefix=product:cache:rebuild:job:
product.cache.rebuild-active-key=product:cache:rebuild:active
product.cache.rebuild-job-ttl-seconds=86400
product.cache.rebuild-active-ttl-seconds=21600

product.cache.enabled=${PRODUCT_CACHE_ENABLED:true}
product.cache.key-prefix=product
product.cache.key-version=${PRODUCT_CACHE_KEY_VERSION:v1}
product.cache.detail-ttl-seconds=1800
product.cache.detail-ttl-jitter-seconds=120
product.cache.runtime-ttl-seconds=300
product.cache.runtime-ttl-jitter-seconds=30
product.cache.circuit-failure-rate-threshold=${PRODUCT_CACHE_CIRCUIT_FAILURE_RATE_THRESHOLD:50}
product.cache.circuit-sliding-window-size=${PRODUCT_CACHE_CIRCUIT_SLIDING_WINDOW_SIZE:20}
product.cache.circuit-minimum-number-of-calls=${PRODUCT_CACHE_CIRCUIT_MINIMUM_NUMBER_OF_CALLS:5}
product.cache.circuit-wait-duration-in-open-state-millis=${PRODUCT_CACHE_CIRCUIT_WAIT_DURATION_IN_OPEN_STATE_MILLIS:30000}
product.cache.circuit-permitted-calls-in-half-open-state=${PRODUCT_CACHE_CIRCUIT_PERMITTED_CALLS_IN_HALF_OPEN_STATE:3}
product.cache.fallback.max-concurrent=${PRODUCT_CACHE_FALLBACK_MAX_CONCURRENT:20}
product.cache.fallback.max-wait-millis=${PRODUCT_CACHE_FALLBACK_MAX_WAIT_MILLIS:0}

product.admin.username=${PRODUCT_ADMIN_USERNAME:admin}
product.admin.password=${PRODUCT_ADMIN_PASSWORD:admin}
